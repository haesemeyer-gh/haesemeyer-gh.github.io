<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../assets/style.css">
	<link rel="icon" type="image/png" href="../assets/katze.png">
	<title>häsemeyer</title>
	<meta property="og:title" content="catify">
	<meta property="og:description" content="Catify any Image using JavaScript right in your Web Browser!">
	<meta property="og:url" content="https://haesemeyer.dev/catify">
	<meta property="og:image" content="https://haesemeyer.dev/assets/banner.jpg">
	<meta property="og:type" content="website">
</head>
<body>

	<main>

		<h1>catify</h1>

		<div class="card catify-menu">
			
			<h3 class="catify-title">menu</h3>

			<label class="catify-label">
				<span>path to image:</span><br/>
				<input type="text" id="catify-src" placeholder="file:///" value="../assets/banner.jpg" />
			</label><br/>
			
			<label class="catify-label">
				<span>speed:</span><br/>
				<input type="range" id="catify-speed" min="0.001" value="4" max="5" step="0.001" />
			</label><br/>
			
			<label class="catify-label">
				<span>stretchiness:</span><br/>
				<input type="range" id="catify-stretchiness" min="1" value="2" max="10" step="0.001" />
			</label><br/>

			<label class="catify-label">
				<span>height:</span><br/>
				<input type="range" id="catify-height" min="100" value="100" max="500" step="0.001" />
			</label><br/>
			
			<label class="catify-label">
				<span>toggle explosion: </span>
				<input type="checkbox" id="catify-explosiontoggle" />
			</label><br/>

			<button id="catify-reset">restore defaults</button>

		</div>

		<div id="katze">
			<img src="../assets/banner.jpg" alt="chosen Image being streched apart endlessly" />
			<div class="display-none"></div>
		</div>
		
	</main>

	<footer>
		<hr />

		</p>
	</footer>

	<script src="../scripts/catify.js"></script>
	<script src="../scripts/zeigestock.js"></script>

</body>
</html>
